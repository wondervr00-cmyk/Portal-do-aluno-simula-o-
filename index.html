<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal do Aluno — Simulação</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

*, *::before, *::after {
  box-sizing: border-box;
}

.pda-root {
  --void: #071a3a;
  --board: #0d2456;
  --board-2: #123268;
  --panel: #122c5e;
  --panel-2: #17397a;
  --line: #2c4d85;
  --chalk: #ffffff;
  --chalk-dim: #c7d6f5;
  --chalk-faint: #90a5d1;
  --gold: #2f8fe0;
  --gold-dim: #1f4f8f;
  --teal: #34d399;
  --brick: #f87171;
  font-family: 'Work Sans', sans-serif;
  background: var(--void);
  color: var(--chalk);
  min-height: 100vh;
  width: 100%;
  position: relative;
}

.pda-hand {
  font-family: 'Caveat', cursive;
}

.pda-mono {
  font-family: 'JetBrains Mono', monospace;
}

/* ---------- LOGIN ---------- */

.pda-login {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.pda-board-hero {
  position: relative;
  flex: 1 1 60%;
  min-height: 420px;
  background:
    radial-gradient(ellipse at 20% 15%, rgba(255,255,255,0.05), transparent 40%),
    radial-gradient(ellipse at 80% 80%, rgba(255,255,255,0.04), transparent 45%),
    radial-gradient(ellipse at 60% 30%, rgba(255,255,255,0.03), transparent 35%),
    linear-gradient(160deg, var(--board-2) 0%, var(--board) 55%, #061532 100%);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 24px 32px;
  border-bottom: 6px solid var(--line);
  box-shadow: inset 0 -40px 60px -40px rgba(0,0,0,0.6);
}

.pda-board-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(
    45deg,
    rgba(255,255,255,0.012) 0px,
    rgba(255,255,255,0.012) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
}

.pda-hand-illustration {
  width: 92px;
  height: auto;
  opacity: 0.9;
  margin-bottom: 6px;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
}

.pda-chalk-line-1 {
  font-size: clamp(2.8rem, 9vw, 4.8rem);
  line-height: 1;
  letter-spacing: 0.5px;
  color: var(--chalk);
  text-shadow: 0 0 1px rgba(255,255,255,0.5), 0 0 18px rgba(255,255,255,0.08);
  white-space: nowrap;
  overflow: hidden;
  border-right: 3px solid var(--chalk);
  width: 0ch;
  animation: pda-write-1 1.6s steps(16, end) 0.4s forwards;
}

.pda-chalk-line-2 {
  font-size: clamp(1.3rem, 4.2vw, 1.75rem);
  color: var(--chalk-dim);
  margin-top: 10px;
  white-space: nowrap;
  overflow: hidden;
  width: 0ch;
  border-right: 2px solid var(--chalk-dim);
  opacity: 0;
  animation: pda-write-2 1.4s steps(28, end) 2.1s forwards;
}

@keyframes pda-write-1 {
  0% { width: 0ch; }
  100% { width: 16ch; border-right-color: transparent; }
}
@keyframes pda-write-2 {
  0% { width: 0ch; opacity: 1; }
  1% { opacity: 1; }
  99% { opacity: 1; }
  100% { width: 28ch; opacity: 1; border-right-color: transparent; }
}

.pda-board-tag {
  margin-top: 22px;
  font-size: 0.85rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--chalk-faint);
  font-family: 'JetBrains Mono', monospace;
  opacity: 0;
  animation: pda-fade-in 0.6s ease 3.2s forwards;
}

@keyframes pda-fade-in {
  to { opacity: 1; }
}

.pda-board-hero-photo {
  padding: 0;
  align-items: stretch;
  justify-content: stretch;
  flex: none;
  min-height: 0;
  aspect-ratio: 1430 / 1100;
  border-bottom: 6px solid var(--line);
}
.pda-board-photo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 38%;
  display: block;
  transition: opacity 0.75s ease;
  transform-origin: center;
}

@keyframes pda-kenburns {
  from { transform: scale(1); }
  to { transform: scale(1.07); }
}
.pda-kenburns {
  animation: pda-kenburns 8s ease-out forwards;
}

.pda-hero-dots {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 14px;
  display: flex;
  justify-content: center;
  gap: 7px;
  z-index: 2;
  padding: 6px 10px;
  margin: 0 auto;
  width: fit-content;
  background: rgba(0,0,0,0.35);
  border-radius: 20px;
}
.pda-hero-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,0.5);
  transition: background 0.3s ease, transform 0.3s ease;
}
.pda-hero-dot.active {
  background: #ffffff;
  transform: scale(1.3);
}

.pda-photo-strip-wrap {
  flex: 0 0 auto;
  background: var(--panel);
  padding: 20px 20px 28px;
  border-bottom: 1px solid var(--line);
}

.pda-photo-strip-label {
  font-size: 0.8rem;
  font-family: 'JetBrains Mono', monospace;
  color: var(--chalk-faint);
  letter-spacing: 0.06em;
  margin-bottom: 10px;
  text-align: center;
}

.pda-photo-strip {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.pda-photo-tile {
  flex: 0 0 auto;
  width: 74px;
  height: 74px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.77rem;
  color: var(--chalk-faint);
  border: 1px dashed var(--line);
}

.pda-roles {
  padding: 22px 20px 36px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 420px;
  margin: 0 auto;
  width: 100%;
}

.pda-role-btn {
  position: relative;
  background: var(--board-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--chalk);
  font-family: 'Work Sans', sans-serif;
  font-weight: 600;
  font-size: 1.04rem;
  padding: 12px 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s ease, transform 0.15s ease, background 0.2s ease;
}

.pda-role-btn span {
  text-align: center;
}

.pda-role-btn svg {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  opacity: 0.6;
}

.pda-role-btn:hover {
  border-color: var(--gold);
  background: var(--panel-2);
  transform: translateY(-1px);
}

.pda-role-btn small {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 400;
  font-size: 0.78rem;
  color: var(--chalk-faint);
  margin-top: 2px;
}

/* ---------- FORM (Aluno / Encarregado) ---------- */

.pda-form-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  background:
    radial-gradient(ellipse at 30% 0%, rgba(47,143,224,0.12), transparent 45%),
    var(--void);
}

.pda-form-card {
  width: 100%;
  max-width: 420px;
  background: var(--board);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 30px 26px 26px;
}

.pda-form-card-hero {
  padding: 0;
  overflow: hidden;
}

.pda-staff-hero {
  position: relative;
  height: 168px;
  overflow: hidden;
}

.pda-staff-hero-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 32%;
  display: block;
  filter: brightness(0.5) saturate(1.15);
}

.pda-staff-hero svg {
  width: 100%;
  height: 100%;
  display: block;
}

.pda-staff-hero-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: flex-end;
  padding: 18px 22px;
  background: linear-gradient(180deg, rgba(7,26,58,0) 35%, rgba(7,26,58,0.92) 100%);
}

.pda-staff-hero-overlay .pda-hand {
  font-size: 2.1rem;
  color: #ffffff;
  text-shadow: 0 2px 10px rgba(0,0,0,0.4);
}

.pda-form-card-body {
  padding: 24px 26px 26px;
}

.pda-form-card-body .pda-back-btn {
  margin-top: -6px;
}

.pda-form-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 6px;
}

.pda-form-title {
  font-family: 'Caveat', cursive;
  font-size: 2.48rem;
  color: var(--chalk);
  margin-bottom: 4px;
}

.pda-form-sub {
  color: var(--chalk-dim);
  font-size: 1.01rem;
  margin-bottom: 22px;
}

.pda-field {
  margin-bottom: 14px;
}

.pda-field label {
  display: block;
  font-size: 0.85rem;
  font-family: 'JetBrains Mono', monospace;
  color: var(--chalk-faint);
  margin-bottom: 6px;
}

.pda-field input, .pda-field select, .pda-field textarea {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 11px 12px;
  color: var(--chalk);
  font-size: 1.09rem;
  font-family: 'Work Sans', sans-serif;
  outline: none;
  transition: border-color 0.15s ease;
}

.pda-field textarea { resize: vertical; min-height: 74px; }

.pda-field input:focus, .pda-field select:focus, .pda-field textarea:focus {
  border-color: var(--gold);
}

.pda-team-link {
  text-align: center;
  margin-top: 4px;
}
.pda-team-link button {
  background: none;
  border: none;
  color: var(--chalk-faint);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  letter-spacing: 0.04em;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.pda-team-link button:hover { color: var(--teal); }

.pda-manage-form {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.pda-manage-form input {
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px 12px;
  color: var(--chalk);
  font-size: 1.01rem;
}
.pda-manage-form select {
  min-width: 0;
}
.pda-manage-form button {
  background: var(--gold);
  border: none;
  color: var(--chalk);
  font-weight: 700;
  font-size: 0.94rem;
  padding: 0 16px;
  border-radius: 9px;
  cursor: pointer;
  white-space: nowrap;
}
.pda-remove-btn {
  background: none;
  border: none;
  color: var(--chalk-faint);
  cursor: pointer;
  padding: 6px;
  border-radius: 6px;
}
.pda-remove-btn:hover { color: var(--brick); background: var(--panel); }

.pda-publish-form {
  background: var(--board);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 18px;
}
.pda-publish-form input, .pda-publish-form textarea {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px 12px;
  color: var(--chalk);
  font-size: 1.01rem;
  margin-bottom: 8px;
  font-family: 'Work Sans', sans-serif;
}
.pda-publish-form button {
  background: var(--gold);
  border: none;
  color: var(--chalk);
  font-weight: 700;
  font-size: 0.97rem;
  padding: 9px 16px;
  border-radius: 9px;
  cursor: pointer;
}
.pda-empty-note {
  color: var(--chalk-faint);
  font-size: 0.94rem;
  font-family: 'JetBrains Mono', monospace;
  text-align: center;
  padding: 18px 0;
  border: 1px dashed var(--line);
  border-radius: 10px;
}

.pda-primary-btn {
  width: 100%;
  background: var(--gold);
  color: var(--chalk);
  border: none;
  border-radius: 10px;
  padding: 12px;
  font-weight: 700;
  font-size: 1.09rem;
  cursor: pointer;
  margin-top: 6px;
  transition: filter 0.15s ease;
}
.pda-primary-btn:hover { filter: brightness(1.08); }

.pda-link-row {
  text-align: center;
  margin-top: 16px;
  font-size: 0.97rem;
  color: var(--chalk-dim);
}
.pda-link-row button {
  background: none;
  border: none;
  color: var(--teal);
  font-weight: 600;
  cursor: pointer;
  font-size: 0.97rem;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.pda-back-btn {
  background: none;
  border: none;
  color: var(--chalk-faint);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  cursor: pointer;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.pda-back-btn:hover { color: var(--chalk); }

.pda-hint-box {
  margin-top: 16px;
  border: 1px dashed var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 0.9rem;
  color: var(--chalk-faint);
  line-height: 1.5;
}

/* ---------- VISITOR CHOICE ---------- */

.pda-visitor-choice {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.pda-choice-btn {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--chalk);
  padding: 13px 14px;
  text-align: left;
  cursor: pointer;
  font-size: 1.04rem;
}
.pda-choice-btn:hover { border-color: var(--teal); }

/* ---------- APP SHELL ---------- */

.pda-app {
  min-height: 100vh;
  background: var(--void);
  display: flex;
  flex-direction: column;
}

.pda-topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: rgba(7,26,58,0.92);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}

.pda-topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.pda-icon-btn {
  background: none;
  border: none;
  color: var(--chalk);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px;
  border-radius: 8px;
}
.pda-icon-btn:hover { background: var(--panel); }

.pda-brand {
  font-family: 'Caveat', cursive;
  font-size: 1.77rem;
  color: var(--chalk);
}

.pda-role-chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.73rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--gold);
  border: 1px solid var(--gold-dim);
  border-radius: 20px;
  padding: 3px 9px;
}

.pda-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--teal);
  color: var(--chalk);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.94rem;
  font-family: 'Work Sans', sans-serif;
}

/* Drawer */

.pda-drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 30;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.pda-drawer-overlay.open {
  opacity: 1;
  pointer-events: auto;
}

.pda-drawer {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: 280px;
  background: var(--board);
  border-right: 1px solid var(--line);
  z-index: 31;
  transform: translateX(-100%);
  transition: transform 0.25s ease;
  display: flex;
  flex-direction: column;
  padding: 20px 0;
}
.pda-drawer.open {
  transform: translateX(0);
}

.pda-drawer-header {
  padding: 4px 20px 18px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 8px;
}
.pda-drawer-header .pda-hand {
  font-size: 2.01rem;
  color: var(--gold);
}
.pda-drawer-header p {
  font-size: 0.85rem;
  color: var(--chalk-faint);
  margin-top: 2px;
  font-family: 'JetBrains Mono', monospace;
}

.pda-drawer-list {
  list-style: none;
  margin: 0;
  padding: 0 10px;
  overflow-y: auto;
  flex: 1;
}

.pda-drawer-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  background: none;
  border: none;
  color: var(--chalk-dim);
  padding: 11px 12px;
  border-radius: 9px;
  font-size: 1.04rem;
  cursor: pointer;
  text-align: left;
  margin-bottom: 2px;
}
.pda-drawer-item:hover {
  background: var(--panel);
  color: var(--chalk);
}
.pda-drawer-item.active {
  background: var(--panel-2);
  color: var(--gold);
  border-left: 2px solid var(--gold);
}

.pda-drawer-footer {
  padding: 10px 10px 4px;
  border-top: 1px solid var(--line);
  margin-top: 8px;
}

/* Main content */

.pda-main {
  flex: 1;
  padding: 18px 16px 60px;
  max-width: 640px;
  margin: 0 auto;
  width: 100%;
}

/* Feed */

.pda-flyer {
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 18px;
  background: linear-gradient(135deg, var(--board-2), var(--panel-2));
  border: 1px solid var(--line);
  padding: 22px 20px;
  position: relative;
}
.pda-flyer-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.76rem;
  color: var(--teal);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.pda-flyer h2 {
  font-family: 'Caveat', cursive;
  font-size: 2.36rem;
  margin: 4px 0 2px;
  color: var(--chalk);
}
.pda-flyer p {
  color: var(--chalk-dim);
  font-size: 1.0rem;
}
.pda-flyer button {
  margin-top: 12px;
  background: var(--gold);
  border: none;
  color: var(--chalk);
  font-weight: 700;
  font-size: 0.94rem;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
}

.pda-post {
  background: var(--board);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
}
.pda-post-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.pda-post-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--panel-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  color: var(--gold);
  border: 1px solid var(--gold-dim);
  flex-shrink: 0;
}
.pda-post-meta strong {
  display: block;
  font-size: 1.04rem;
  color: var(--chalk);
}
.pda-post-meta span {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  color: var(--chalk-faint);
}
.pda-post-tag {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.73rem;
  color: var(--teal);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 3px 9px;
  white-space: nowrap;
}
.pda-post-body {
  color: var(--chalk-dim);
  font-size: 1.03rem;
  line-height: 1.55;
  margin-bottom: 12px;
}
.pda-post-actions {
  display: flex;
  gap: 18px;
  border-top: 1px solid var(--line);
  padding-top: 10px;
}
.pda-post-action {
  background: none;
  border: none;
  color: var(--chalk-faint);
  font-size: 0.92rem;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.pda-post-action.liked { color: var(--brick); }
.pda-post-action:hover { color: var(--chalk); }

/* Module placeholder */

.pda-module-head {
  margin-bottom: 20px;
}
.pda-module-head .pda-hand {
  font-size: 2.48rem;
  color: var(--chalk);
}
.pda-module-head p {
  color: var(--chalk-dim);
  font-size: 1.04rem;
  margin-top: 4px;
  max-width: 46ch;
}

.pda-section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gold);
  margin: 22px 0 10px;
}

.pda-card-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
