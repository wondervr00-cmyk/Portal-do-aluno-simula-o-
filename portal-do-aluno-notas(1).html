<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal do Aluno — Simulação</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

*, *::before, *::after {
  box-sizing: border-box;
}

.pda-root {
  --void: #071a3a;
  --board: #0d2456;
  --board-2: #123268;
  --panel: #122c5e;
  --panel-2: #17397a;
  --line: #2c4d85;
  --chalk: #ffffff;
  --chalk-dim: #c7d6f5;
  --chalk-faint: #90a5d1;
  --gold: #2f8fe0;
  --gold-dim: #1f4f8f;
  --teal: #34d399;
  --brick: #f87171;
  font-family: 'Work Sans', sans-serif;
  background: var(--void);
  color: var(--chalk);
  min-height: 100vh;
  width: 100%;
  position: relative;
}

.pda-hand {
  font-family: 'Caveat', cursive;
}

.pda-mono {
  font-family: 'JetBrains Mono', monospace;
}

/* ---------- LOGIN ---------- */

.pda-login {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.pda-board-hero {
  position: relative;
  flex: 1 1 60%;
  min-height: 420px;
  background:
    radial-gradient(ellipse at 20% 15%, rgba(255,255,255,0.05), transparent 40%),
    radial-gradient(ellipse at 80% 80%, rgba(255,255,255,0.04), transparent 45%),
    radial-gradient(ellipse at 60% 30%, rgba(255,255,255,0.03), transparent 35%),
    linear-gradient(160deg, var(--board-2) 0%, var(--board) 55%, #061532 100%);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 24px 32px;
  border-bottom: 6px solid var(--line);
  box-shadow: inset 0 -40px 60px -40px rgba(0,0,0,0.6);
}

.pda-board-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(
    45deg,
    rgba(255,255,255,0.012) 0px,
    rgba(255,255,255,0.012) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
}

.pda-hand-illustration {
  width: 92px;
  height: auto;
  opacity: 0.9;
  margin-bottom: 6px;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
}

.pda-chalk-line-1 {
  font-size: clamp(2.2rem, 7vw, 3.6rem);
  line-height: 1;
  letter-spacing: 0.5px;
  color: var(--chalk);
  text-shadow: 0 0 1px rgba(255,255,255,0.5), 0 0 18px rgba(255,255,255,0.08);
  white-space: nowrap;
  overflow: hidden;
  border-right: 3px solid var(--chalk);
  width: 0ch;
  animation: pda-write-1 1.6s steps(16, end) 0.4s forwards;
}

.pda-chalk-line-2 {
  font-size: clamp(1.05rem, 3.4vw, 1.35rem);
  color: var(--chalk-dim);
  margin-top: 10px;
  white-space: nowrap;
  overflow: hidden;
  width: 0ch;
  border-right: 2px solid var(--chalk-dim);
  opacity: 0;
  animation: pda-write-2 1.4s steps(28, end) 2.1s forwards;
}

@keyframes pda-write-1 {
  0% { width: 0ch; }
  100% { width: 16ch; border-right-color: transparent; }
}
@keyframes pda-write-2 {
  0% { width: 0ch; opacity: 1; }
  1% { opacity: 1; }
  99% { opacity: 1; }
  100% { width: 28ch; opacity: 1; border-right-color: transparent; }
}

.pda-board-tag {
  margin-top: 22px;
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--chalk-faint);
  font-family: 'JetBrains Mono', monospace;
  opacity: 0;
  animation: pda-fade-in 0.6s ease 3.2s forwards;
}

@keyframes pda-fade-in {
  to { opacity: 1; }
}

.pda-board-hero-photo {
  padding: 0;
  align-items: stretch;
  justify-content: stretch;
  flex: none;
  min-height: 0;
  aspect-ratio: 1430 / 1100;
  border-bottom: 6px solid var(--line);
}
.pda-board-photo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 38%;
  display: block;
  transition: opacity 0.75s ease;
  transform-origin: center;
}

@keyframes pda-kenburns {
  from { transform: scale(1); }
  to { transform: scale(1.07); }
}
.pda-kenburns {
  animation: pda-kenburns 8s ease-out forwards;
}

.pda-hero-dots {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 14px;
  display: flex;
  justify-content: center;
  gap: 7px;
  z-index: 2;
  padding: 6px 10px;
  margin: 0 auto;
  width: fit-content;
  background: rgba(0,0,0,0.35);
  border-radius: 20px;
}
.pda-hero-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,0.5);
  transition: background 0.3s ease, transform 0.3s ease;
}
.pda-hero-dot.active {
  background: #ffffff;
  transform: scale(1.3);
}

.pda-photo-strip-wrap {
  flex: 0 0 auto;
  background: var(--panel);
  padding: 20px 20px 28px;
  border-bottom: 1px solid var(--line);
}

.pda-photo-strip-label {
  font-size: 0.68rem;
  font-family: 'JetBrains Mono', monospace;
  color: var(--chalk-faint);
  letter-spacing: 0.06em;
  margin-bottom: 10px;
  text-align: center;
}

.pda-photo-strip {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 4px;
}

.pda-photo-tile {
  flex: 0 0 auto;
  width: 74px;
  height: 74px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  color: var(--chalk-faint);
  border: 1px dashed var(--line);
}

.pda-roles {
  padding: 22px 20px 36px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 420px;
  margin: 0 auto;
  width: 100%;
}

.pda-role-btn {
  position: relative;
  background: var(--board-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--chalk);
  font-family: 'Work Sans', sans-serif;
  font-weight: 600;
  font-size: 0.88rem;
  padding: 10px 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s ease, transform 0.15s ease, background 0.2s ease;
}

.pda-role-btn span {
  text-align: center;
}

.pda-role-btn svg {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  opacity: 0.6;
}

.pda-role-btn:hover {
  border-color: var(--gold);
  background: var(--panel-2);
  transform: translateY(-1px);
}

.pda-role-btn small {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 400;
  font-size: 0.66rem;
  color: var(--chalk-faint);
  margin-top: 2px;
}

/* ---------- FORM (Aluno / Encarregado) ---------- */

.pda-form-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  background:
    radial-gradient(ellipse at 30% 0%, rgba(47,143,224,0.12), transparent 45%),
    var(--void);
}

.pda-form-card {
  width: 100%;
  max-width: 420px;
  background: var(--board);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 30px 26px 26px;
}

.pda-form-card-hero {
  padding: 0;
  overflow: hidden;
}

.pda-staff-hero {
  position: relative;
  height: 168px;
  overflow: hidden;
}

.pda-staff-hero-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 32%;
  display: block;
  filter: brightness(0.5) saturate(1.15);
}

.pda-staff-hero svg {
  width: 100%;
  height: 100%;
  display: block;
}

.pda-staff-hero-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: flex-end;
  padding: 18px 22px;
  background: linear-gradient(180deg, rgba(7,26,58,0) 35%, rgba(7,26,58,0.92) 100%);
}

.pda-staff-hero-overlay .pda-hand {
  font-size: 1.78rem;
  color: #ffffff;
  text-shadow: 0 2px 10px rgba(0,0,0,0.4);
}

.pda-form-card-body {
  padding: 24px 26px 26px;
}

.pda-form-card-body .pda-back-btn {
  margin-top: -6px;
}

.pda-form-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 6px;
}

.pda-form-title {
  font-family: 'Caveat', cursive;
  font-size: 2.1rem;
  color: var(--chalk);
  margin-bottom: 4px;
}

.pda-form-sub {
  color: var(--chalk-dim);
  font-size: 0.86rem;
  margin-bottom: 22px;
}

.pda-field {
  margin-bottom: 14px;
}

.pda-field label {
  display: block;
  font-size: 0.72rem;
  font-family: 'JetBrains Mono', monospace;
  color: var(--chalk-faint);
  margin-bottom: 6px;
}

.pda-field input, .pda-field select, .pda-field textarea {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 11px 12px;
  color: var(--chalk);
  font-size: 0.92rem;
  font-family: 'Work Sans', sans-serif;
  outline: none;
  transition: border-color 0.15s ease;
}

.pda-field textarea { resize: vertical; min-height: 74px; }

.pda-field input[type="file"] {
  padding: 9px 10px;
  font-size: 0.76rem;
  color: var(--chalk-dim);
}
.pda-field input[type="file"]::file-selector-button {
  background: var(--gold);
  color: var(--chalk);
  border: none;
  border-radius: 7px;
  padding: 7px 12px;
  margin-right: 10px;
  font-family: 'Work Sans', sans-serif;
  font-weight: 600;
  font-size: 0.72rem;
  cursor: pointer;
}

.pda-field input:focus, .pda-field select:focus, .pda-field textarea:focus {
  border-color: var(--gold);
}

.pda-team-link {
  text-align: center;
  margin-top: 4px;
}
.pda-team-link button {
  background: none;
  border: none;
  color: var(--chalk-faint);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  letter-spacing: 0.04em;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.pda-team-link button:hover { color: var(--teal); }

.pda-manage-form {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.pda-manage-form input {
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px 12px;
  color: var(--chalk);
  font-size: 0.86rem;
}
.pda-manage-form select {
  min-width: 0;
}
.pda-manage-form button {
  background: var(--gold);
  border: none;
  color: var(--chalk);
  font-weight: 700;
  font-size: 0.8rem;
  padding: 0 16px;
  border-radius: 9px;
  cursor: pointer;
  white-space: nowrap;
}
.pda-remove-btn {
  background: none;
  border: none;
  color: var(--chalk-faint);
  cursor: pointer;
  padding: 6px;
  border-radius: 6px;
}
.pda-remove-btn:hover { color: var(--brick); background: var(--panel); }

.pda-publish-form {
  background: var(--board);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 18px;
}
.pda-publish-form input, .pda-publish-form textarea {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px 12px;
  color: var(--chalk);
  font-size: 0.86rem;
  margin-bottom: 8px;
  font-family: 'Work Sans', sans-serif;
}
.pda-publish-form button {
  background: var(--gold);
  border: none;
  color: var(--chalk);
  font-weight: 700;
  font-size: 0.82rem;
  padding: 9px 16px;
  border-radius: 9px;
  cursor: pointer;
}
.pda-empty-note {
  color: var(--chalk-faint);
  font-size: 0.8rem;
  font-family: 'JetBrains Mono', monospace;
  text-align: center;
  padding: 18px 0;
  border: 1px dashed var(--line);
  border-radius: 10px;
}

.pda-primary-btn {
  width: 100%;
  background: var(--gold);
  color: var(--chalk);
  border: none;
  border-radius: 10px;
  padding: 12px;
  font-weight: 700;
  font-size: 0.92rem;
  cursor: pointer;
  margin-top: 6px;
  transition: filter 0.15s ease;
}
.pda-primary-btn:hover { filter: brightness(1.08); }

.pda-link-row {
  text-align: center;
  margin-top: 16px;
  font-size: 0.82rem;
  color: var(--chalk-dim);
}
.pda-link-row button {
  background: none;
  border: none;
  color: var(--teal);
  font-weight: 600;
  cursor: pointer;
  font-size: 0.82rem;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.pda-back-btn {
  background: none;
  border: none;
  color: var(--chalk-faint);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  cursor: pointer;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.pda-back-btn:hover { color: var(--chalk); }

.pda-hint-box {
  margin-top: 16px;
  border: 1px dashed var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 0.76rem;
  color: var(--chalk-faint);
  line-height: 1.5;
}

/* ---------- VISITOR CHOICE ---------- */

.pda-visitor-choice {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.pda-choice-btn {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--chalk);
  padding: 13px 14px;
  text-align: left;
  cursor: pointer;
  font-size: 0.88rem;
}
.pda-choice-btn:hover { border-color: var(--teal); }

/* ---------- APP SHELL ---------- */

.pda-app {
  min-height: 100vh;
  background: var(--void);
  display: flex;
  flex-direction: column;
}

.pda-topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: rgba(7,26,58,0.92);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}

.pda-topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.pda-icon-btn {
  background: none;
  border: none;
  color: var(--chalk);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px;
  border-radius: 8px;
}
.pda-icon-btn:hover { background: var(--panel); }

.pda-brand {
  font-family: 'Caveat', cursive;
  font-size: 1.5rem;
  color: var(--chalk);
}

.pda-role-chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--gold);
  border: 1px solid var(--gold-dim);
  border-radius: 20px;
  padding: 3px 9px;
}

.pda-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--teal);
  color: var(--chalk);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.8rem;
  font-family: 'Work Sans', sans-serif;
}

/* Drawer */

.pda-drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 30;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.pda-drawer-overlay.open {
  opacity: 1;
  pointer-events: auto;
}

.pda-drawer {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: 280px;
  background: var(--board);
  border-right: 1px solid var(--line);
  z-index: 31;
  transform: translateX(-100%);
  transition: transform 0.25s ease;
  display: flex;
  flex-direction: column;
  padding: 20px 0;
}
.pda-drawer.open {
  transform: translateX(0);
}

.pda-drawer-header {
  padding: 4px 20px 18px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 8px;
}
.pda-drawer-header .pda-hand {
  font-size: 1.7rem;
  color: var(--gold);
}
.pda-drawer-header p {
  font-size: 0.72rem;
  color: var(--chalk-faint);
  margin-top: 2px;
  font-family: 'JetBrains Mono', monospace;
}

.pda-drawer-list {
  list-style: none;
  margin: 0;
  padding: 0 10px;
  overflow-y: auto;
  flex: 1;
}

.pda-drawer-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  background: none;
  border: none;
  color: var(--chalk-dim);
  padding: 11px 12px;
  border-radius: 9px;
  font-size: 0.88rem;
  cursor: pointer;
  text-align: left;
  margin-bottom: 2px;
}
.pda-drawer-item:hover {
  background: var(--panel);
  color: var(--chalk);
}
.pda-drawer-item.active {
  background: var(--panel-2);
  color: var(--gold);
  border-left: 2px solid var(--gold);
}

.pda-drawer-footer {
  padding: 10px 10px 4px;
  border-top: 1px solid var(--line);
  margin-top: 8px;
}

/* Main content */

.pda-main {
  flex: 1;
  padding: 18px 16px 60px;
  max-width: 640px;
  margin: 0 auto;
  width: 100%;
}

/* Feed */

.pda-flyer {
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 18px;
  background: linear-gradient(135deg, var(--board-2), var(--panel-2));
  border: 1px solid var(--line);
  padding: 22px 20px;
  position: relative;
}
.pda-flyer-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.64rem;
  color: var(--teal);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.pda-flyer h2 {
  font-family: 'Caveat', cursive;
  font-size: 2.0rem;
  margin: 4px 0 2px;
  color: var(--chalk);
}
.pda-flyer p {
  color: var(--chalk-dim);
  font-size: 0.85rem;
}
.pda-flyer button {
  margin-top: 12px;
  background: var(--gold);
  border: none;
  color: var(--chalk);
  font-weight: 700;
  font-size: 0.8rem;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
}

.pda-post {
  background: var(--board);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
}
.pda-post-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.pda-post-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--panel-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  color: var(--gold);
  border: 1px solid var(--gold-dim);
  flex-shrink: 0;
}
.pda-post-meta strong {
  display: block;
  font-size: 0.88rem;
  color: var(--chalk);
}
.pda-post-meta span {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.66rem;
  color: var(--chalk-faint);
}
.pda-post-tag {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem;
  color: var(--teal);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 3px 9px;
  white-space: nowrap;
}
.pda-post-body {
  color: var(--chalk-dim);
  font-size: 0.87rem;
  line-height: 1.55;
  margin-bottom: 12px;
}
.pda-post-actions {
  display: flex;
  gap: 18px;
  border-top: 1px solid var(--line);
  padding-top: 10px;
}
.pda-post-action {
  background: none;
  border: none;
  color: var(--chalk-faint);
  font-size: 0.78rem;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.pda-post-action.liked { color: var(--brick); }
.pda-post-action:hover { color: var(--chalk); }

/* Module placeholder */

.pda-module-head {
  margin-bottom: 20px;
}
.pda-module-head .pda-hand {
  font-size: 2.1rem;
  color: var(--chalk);
}
.pda-module-head p {
  color: var(--chalk-dim);
  font-size: 0.88rem;
  margin-top: 4px;
  max-width: 46ch;
}

.pda-section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gold);
  margin: 22px 0 10px;
}

.pda-card-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.pda-book-card, .pda-video-card {
  background: var(--board);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.pda-book-cover {
  height: 96px;
  background: linear-gradient(135deg, var(--panel-2), var(--board-2));
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--chalk-faint);
}
.pda-video-thumb {
  height: 88px;
  background: linear-gradient(135deg, var(--panel-2), var(--board-2));
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gold);
  position: relative;
}
.pda-book-info, .pda-video-info {
  padding: 10px 10px 12px;
}
.pda-book-info strong, .pda-video-info strong {
  display: block;
  font-size: 0.8rem;
  color: var(--chalk);
  margin-bottom: 2px;
  line-height: 1.3;
}
.pda-book-info span, .pda-video-info span {
  font-size: 0.7rem;
  color: var(--chalk-faint);
}
.pda-mini-btn {
  margin-top: 8px;
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--chalk);
  font-size: 0.7rem;
  padding: 7px;
  border-radius: 7px;
  cursor: pointer;
}
.pda-mini-btn:hover { border-color: var(--gold); color: var(--gold); }
.pda-mini-btn.locked {
  opacity: 0.45;
  cursor: not-allowed;
}

.pda-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
}
.pda-table th {
  text-align: left;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.64rem;
  color: var(--chalk-faint);
  text-transform: uppercase;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
}
.pda-table td {
  padding: 10px;
  border-bottom: 1px solid var(--line);
  color: var(--chalk-dim);
}
.pda-status {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.66rem;
  padding: 3px 8px;
  border-radius: 20px;
}
.pda-status.ok { color: var(--teal); border: 1px solid var(--teal); }
.pda-status.warn { color: var(--brick); border: 1px solid var(--brick); }

.pda-list-card {
  background: var(--board);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.pda-list-card strong { display: block; font-size: 0.86rem; color: var(--chalk); }
.pda-list-card span { font-size: 0.72rem; color: var(--chalk-faint); }

.pda-chat-window {
  background: var(--board);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.pda-chat-msg {
  max-width: 76%;
  padding: 9px 12px;
  border-radius: 12px;
  font-size: 0.82rem;
  line-height: 1.4;
}
.pda-chat-msg.them {
  background: var(--panel);
  color: var(--chalk-dim);
  align-self: flex-start;
  border-bottom-left-radius: 3px;
}
.pda-chat-msg.me {
  background: var(--gold-dim);
  color: var(--chalk);
  align-self: flex-end;
  border-bottom-right-radius: 3px;
}
.pda-chat-input-row {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}
.pda-chat-input-row input {
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 9px 14px;
  color: var(--chalk-dim);
  font-size: 0.82rem;
}

.pda-profile-card {
  background: var(--board);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px;
}
.pda-profile-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  font-size: 0.85rem;
}
.pda-profile-row:last-child { border-bottom: none; }
.pda-profile-row span:first-child { color: var(--chalk-faint); font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; }
.pda-profile-row span:last-child { color: var(--chalk); }

.pda-toggle-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}
.pda-toggle-row:last-child { border-bottom: none; }
.pda-toggle-row span { font-size: 0.86rem; color: var(--chalk); }
.pda-toggle {
  width: 38px;
  height: 22px;
  border-radius: 20px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  position: relative;
  cursor: pointer;
}
.pda-toggle.on { background: var(--gold-dim); border-color: var(--gold); }
.pda-toggle::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--chalk);
  transition: left 0.15s ease;
}
.pda-toggle.on::after { left: 18px; background: var(--gold); }

.pda-lock-note {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--panel);
  border: 1px dashed var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 0.76rem;
  color: var(--chalk-faint);
  margin-top: 16px;
}

@media (min-width: 560px) {
  .pda-card-grid { grid-template-columns: repeat(3, 1fr); }
}


/* =========================================================
   RESPONSIVO — telemóvel (padrão), tablet e desktop
========================================================= */

#root {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--void, #f1f8f6);
}

body {
  margin: 0;
  background: #04122b;
}

@media (min-width: 720px) {
  body { background: #04122b; padding: 28px 0; }
  #root {
    max-width: 720px;
    min-height: calc(100vh - 56px);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7);
  }
  .pda-card-grid { grid-template-columns: repeat(3, 1fr); }
  .pda-login .pda-roles { max-width: 480px; }
}

@media (min-width: 1080px) {
  #root {
    max-width: 1120px;
  }

  #root.pda-screen-app .pda-app {
    display: grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: auto 1fr;
    min-height: 100vh;
  }
  #root.pda-screen-app .pda-topbar {
    grid-column: 1 / -1;
    position: static;
  }
  #root.pda-screen-app .pda-drawer {
    position: sticky;
    top: 0;
    transform: none !important;
    grid-column: 1;
    grid-row: 2;
    height: calc(100vh - 61px);
    border-right: 1px solid var(--line);
  }
  #root.pda-screen-app .pda-drawer-overlay { display: none !important; }
  #root.pda-screen-app .pda-main {
    grid-column: 2;
    grid-row: 2;
    max-width: 760px;
    width: 100%;
  }
  .pda-card-grid { grid-template-columns: repeat(4, 1fr); }
  .pda-icon-btn[data-action="toggle-drawer"] { display: none; }
}

@media (min-width: 720px) and (max-width: 1079px) {
  .pda-roles { max-width: 520px; }
}

</style>

  function esc(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function initialsOf(name) {

  }

  function slugify(name) {
    var base = (name || "colegio").toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, "-").replace(/(^-+|-+$)/g, "");
    return base || "colegio";
  }

  /* ---------------------------------------------------------
     Escala de notas — automática por classe, como no enunciado:
     Pré à 6ª classe → 0 a 10 (positiva a partir de 5)
     7ª à 13ª classe → 0 a 20 (positiva a partir de 10)
  --------------------------------------------------------- */
  function classeNumber(turma) {
    if (!turma) return 7;
    if (/pr[ée]/i.test(turma)) return 0;
    var m = turma.match(/(\d+)/);
    return m ? parseInt(m[1], 10) : 7;
  }
  function escalaDaTurma(turma) {
    var c = classeNumber(turma);
    return c <= 6 ? { max: 10, positivoMin: 5 } : { max: 20, positivoMin: 10 };
  }
  function situacaoDaNota(nota, turma) {
    var escala = escalaDaTurma(turma);
    return Number(nota) >= escala.positivoMin ? "Positiva" : "Negativa";
  }
  function notaColorClass(nota, turma) {
    return situacaoDaNota(nota, turma) === "Positiva" ? "ok" : "warn";
  }

  function currentSchool() {
    for (var i = 0; i < S.schools.length; i++) {
      if (S.schools[i].slug === S.currentSchoolSlug) return S.schools[i];
    }
    return null;
  }

  function findOrCreateSchool(name) {
    var n = (name || "").trim();
    if (!n) return null;
    for (var i = 0; i < S.schools.length; i++) {
      if (S.schools[i].name.toLowerCase() === n.toLowerCase()) return S.schools[i];
    }
    var slug = slugify(n), base = slug, count = 1;
    while (S.schools.some(function (s) { return s.slug === slug; })) { slug = base + "-" + (++count); }
    var fresh = {
      slug: slug, name: n, area: "Ensino geral",
      info: "Informações desta escola ainda não foram configuradas pela direção.",
      classes: [],
      matriculaValor: "a definir", matriculaPeriodo: "a definir",
      matriculaDocumentos: [], matriculaCampos: ["Nome completo", "Telefone"],
      propinasValor: "a definir", propinasVencimento: "a definir", propinasMulta: "a definir",
      documentosTipos: ["Certificado", "Declaração"],
      whatsapp: "+244 900 000 000",
      servicos: [], regras: ""
    };
    S.schools.push(fresh);
    return fresh;
  }

  function pautaResultsHTML(pauta, query) {
    var q = (query || "").trim().toLowerCase();
    var list = pauta.resultados.filter(function (r) {
      return !q || r.aluno.toLowerCase().indexOf(q) !== -1;
    });
    if (list.length === 0) {
      return '<div class="pda-empty-note">nenhum aluno encontrado com esse nome</div>';
    }
    return list.map(function (r) {
      return listCard(r.aluno, "", '<span class="pda-status ' + (r.situacao === "Aprovado" ? "ok" : "warn") + '">' + esc(r.situacao) + '</span>');
    }).join("");
  }

  function pautasHTML() {
    var rows = S.grades.map(function (r) {
      return '<tr><td>' + esc(r.disciplina) + '</td><td class="pda-mono">' + esc(r.nota) + '</td><td><span class="pda-status ' + (r.situacao === "Aprovado" ? "ok" : "warn") + '">' + esc(r.situacao) + '</span></td></tr>';
    }).join("");

    var pautasPublicadas = S.pautas.map(function (p) {
      return (
        '<div class="pda-form-card" style="max-width:none;padding:16px;margin-bottom:12px">' +
          '<strong>Pauta — ' + esc(p.turma) + ' — ' + esc(p.ano) + '</strong>' +
          '<div class="pda-mono" style="font-size:0.61rem;color:var(--chalk-faint);margin:2px 0 10px">publicada ' + esc(p.publicadaEm) + '</div>' +
          '<input data-live-filter="pauta" data-pauta-id="' + p.id + '" placeholder="Pesquisar pelo teu nome..." autocomplete="off" style="width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--chalk);margin-bottom:10px">' +
          '<div id="pauta-results-' + p.id + '">' + pautaResultsHTML(p, "") + '</div>' +
        '</div>'
      );
    }).join("");

    return (
      moduleHead(S.role === "encarregado" ? "Pautas do educando" : "As tuas pautas", "Resultados do trimestre atual, disciplina a disciplina.") +
      '<table class="pda-table"><thead><tr><th>Disciplina</th><th>Nota</th><th>Situação</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      (pautasPublicadas ? '<div class="pda-section-label">Pautas publicadas pela escola</div>' + pautasPublicadas : "")
    );
  }

  function computeVeredito(disciplinas) {
    var reprovadas = disciplinas.filter(function (d) { return d.situacao === "Reprovado"; });
    var soma = disciplinas.reduce(function (acc, d) { return acc + (parseFloat(d.nota) || 0); }, 0);
    var media = disciplinas.length ? soma / disciplinas.length : 0;
    return { media: media.toFixed(1), apto: reprovadas.length === 0, reprovadas: reprovadas };
  }

  function boletimHTML() {
    var b = S.boletimFinal;
    var v = computeVeredito(b.disciplinas);
    var rows = b.disciplinas.map(function (r) {
      return '<tr><td>' + esc(r.disciplina) + '</td><td class="pda-mono">' + esc(r.nota) + '</td><td><span class="pda-status ' + (r.situacao === "Aprovado" ? "ok" : "warn") + '">' + esc(r.situacao) + '</span></td></tr>';
    }).join("");

    var vereditoColor = v.apto ? "var(--teal)" : "var(--brick)";
    var vereditoLabel = v.apto ? "✅ APTO" : "❌ NÃO APTO";
    var vereditoNote = v.apto
      ? "O aluno concluiu o ano letivo com aproveitamento em todas as disciplinas."
      : "O aluno reprovou em " + v.reprovadas.length + " disciplina" + (v.reprovadas.length > 1 ? "s" : "") + ": " + v.reprovadas.map(function (d) { return esc(d.disciplina); }).join(", ") + ". Necessita de exame de recurso ou repetição.";

    return (
      moduleHead(S.role === "encarregado" ? "Boletim de notas do educando" : "Boletim de notas", esc(b.trimestre) + " — resultado que determina se o aluno está apto a transitar de classe.") +
      '<div class="pda-form-card" style="max-width:none;padding:20px;text-align:center;border-color:' + vereditoColor + '">' +
        '<div style="font-family:\'JetBrains Mono\',monospace;font-size:0.7rem;color:var(--chalk-faint);letter-spacing:0.08em;text-transform:uppercase">veredito final</div>' +
        '<div class="pda-hand" style="font-size:2.4rem;color:' + vereditoColor + ';margin:6px 0">' + vereditoLabel + '</div>' +
        '<div style="color:var(--chalk-dim);font-size:0.85rem">Média geral: <span class="pda-mono" style="color:var(--chalk)">' + v.media + '</span></div>' +
      '</div>' +
      '<table class="pda-table" style="margin-top:16px"><thead><tr><th>Disciplina</th><th>Nota</th><th>Situação</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<div class="pda-lock-note" style="margin-top:14px;border-color:' + vereditoColor + ';color:' + vereditoColor + '">' + vereditoNote + '</div>'
    );

  /* ---------------------------------------------------------
     Professor — lançar e retificar notas (escala automática por classe)
  --------------------------------------------------------- */
  function lancarNotasHTML() {
    var mine = S.professorAssignments.filter(function (a) { return a.professor === S.displayName; });
    if (mine.length === 0) mine = S.professorAssignments;
    if (mine.length === 0) {
      return moduleHead("Lançar notas", "Ainda não tens nenhuma turma/disciplina atribuída pela secretaria.");
    }

    var turmaSel = S.selectedLancarTurma || mine[0].turma;
    var discSel = S.selectedLancarDisciplina || mine[0].disciplina;

    var combos = mine.map(function (a) {
      var active = a.turma === turmaSel && a.disciplina === discSel;
      return (
        '<button class="pda-choice-btn" data-action="select-lancar" data-turma="' + esc(a.turma) + '" data-disciplina="' + esc(a.disciplina) + '"' +
        (active ? ' style="border-color:var(--gold);color:var(--gold)"' : "") + '>' +
          esc(a.disciplina) + " — " + esc(a.turma) +
        '</button>'
      );
    }).join("");

    var alunos = resolveListRef("gerir_alunos");
    var escala = escalaDaTurma(turmaSel);

    var rows = alunos.map(function (aluno) {
      var entry = S.gradeEntries.filter(function (g) { return g.turma === turmaSel && g.disciplina === discSel && g.aluno === aluno; })[0];
      var nota = entry ? entry.nota : "";
      var situ = entry ? situacaoDaNota(entry.nota, turmaSel) : "";
      var cls = entry ? notaColorClass(entry.nota, turmaSel) : "";
      return (
        '<div class="pda-list-card"><strong>' + esc(aluno) + '</strong>' +
        '<form data-form="lancar-nota" data-turma="' + esc(turmaSel) + '" data-disciplina="' + esc(discSel) + '" data-aluno="' + esc(aluno) + '" style="display:flex;align-items:center;gap:8px">' +
          '<input name="nota" type="number" min="0" max="' + escala.max + '" value="' + nota + '" style="width:60px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;color:var(--chalk);text-align:center">' +
          (situ ? '<span class="pda-status ' + cls + '">' + situ + '</span>' : "") +
          '<button type="submit" class="pda-mini-btn" style="width:auto;padding:6px 12px">Guardar</button>' +
        '</form></div>'
      );
    }).join("");

    return (
      moduleHead("Lançar notas", "Escala automática: até à 6ª classe é de 0 a 10 (positiva a partir de 5); da 7ª à 13ª é de 0 a 20 (positiva a partir de 10).") +
      '<div class="pda-visitor-choice" style="margin-bottom:14px">' + combos + '</div>' +
      '<div class="pda-hint-box" style="margin-bottom:14px">Turma: <strong>' + esc(turmaSel) + '</strong> · Disciplina: <strong>' + esc(discSel) + '</strong> · Escala: 0 a ' + escala.max + '</div>' +
      rows
    );
  }

    if (!sch) return moduleHead("Configurar Propinas", "Nenhum colégio associado a esta sessão.");
    return (
      moduleHead("Configurar propinas", "Valores e prazos aplicados a todos os alunos deste colégio.") +
      '<div class="pda-form-card" style="max-width:none;padding:18px">' +
        '<form data-form="config-propinas">' +
          '<div class="pda-field"><label>Valor da propina</label><input name="valor" value="' + esc(sch.propinasValor) + '"></div>' +
          '<div class="pda-field"><label>Vencimento</label><input name="vencimento" value="' + esc(sch.propinasVencimento) + '"></div>' +
          '<div class="pda-field"><label>Multa por atraso</label><input name="multa" value="' + esc(sch.propinasMulta) + '"></div>' +
          '<button type="submit" class="pda-primary-btn">Guardar</button>' +
        '</form>' +
      '</div>'
    );
  }

  function manageListInner(key, placeholder) {
    var items = resolveListRef(key);
    var rows = items.length === 0
      ? '<div class="pda-empty-note">nenhum registo ainda</div>'
      : items.map(function (it, i) {
          return '<div class="pda-list-card"><strong>' + esc(it) + '</strong><button class="pda-remove-btn" data-action="manage-remove" data-key="' + key + '" data-index="' + i + '">' + icon("close", 16) + '</button></div>';
        }).join("");
    return '<form class="pda-manage-form" data-form="manage-add" data-key="' + key + '"><input name="val" placeholder="' + esc(placeholder) + '"><button type="submit">Adicionar</button></form>' + rows;
  }

  function gerirLivrariaHTML() {
    var items = S.books.escola;
    var rows = items.length === 0
      ? '<div class="pda-empty-note">nenhum livro/material cadastrado ainda</div>'
      : items.map(function (b, i) {
          return (
            '<div class="pda-list-card"><div><strong>' + esc(b.title) + '</strong><span>' + esc(b.author) + '</span></div>' +
            '<button class="pda-remove-btn" data-action="remove-book" data-index="' + i + '">' + icon("close", 16) + '</button></div>'
          );
        }).join("");
    return (
      moduleHead("Gerir livraria", "Cadastra livros, manuais e material escolar com preço e quantidade.") +
      '<form class="pda-publish-form" data-form="add-book">' +
        '<input name="title" placeholder="Título do livro / material">' +
        '<input name="author" placeholder="Autor (opcional)" style="margin-bottom:8px">' +
        '<input name="preco" placeholder="Preço (ex: 5.000 Kz)" style="margin-bottom:8px">' +
        '<input name="qtd" placeholder="Quantidade disponível" style="margin-bottom:8px">' +
        '<button type="submit">Adicionar à livraria</button>' +
      '</form>' + rows
    );
  }

  function gerirConfirmacoesHTML() {
    var rows = S.confirmations.length === 0
      ? '<div class="pda-empty-note">nenhuma confirmação configurada</div>'
      : S.confirmations.map(function (c, i) {
          return (
            '<div class="pda-list-card"><div><strong>' + esc(c.label) + '</strong><span>' + (c.status === "ok" ? "Confirmado" : "Pendente") + '</span></div>' +
            '<button class="pda-remove-btn" data-action="remove-confirmation" data-index="' + i + '">' + icon("close", 16) + '</button></div>'
          );
        }).join("");
    return (
      moduleHead("Gerir confirmações", "Define o que precisa de confirmação por parte dos alunos/encarregados.") +
      '<form class="pda-manage-form" data-form="add-confirmation"><input name="val" placeholder="ex: Confirmar presença na reunião"><button type="submit">Adicionar</button></form>' +
      rows
    );
  }

  function calendarioHTML() {
    var rows = S.calendario.map(function (ev) {
      return '<div class="pda-list-card"><strong>' + esc(ev.nome) + '</strong><span class="pda-mono" style="color:var(--chalk-faint)">' + esc(ev.data) + '</span></div>';
    }).join("");
    return moduleHead("Calendário escolar", "Datas-chave do ano letivo.") + rows;
  }

  function horariosHTML() {
    var rows = S.horarios.map(function (l) {
      return '<tr><td>' + esc(l.dia) + '</td><td class="pda-mono">' + esc(l.hora) + '</td><td>' + esc(l.disciplina) + '</td><td>' + esc(l.turma) + '</td></tr>';
    }).join("");
    return (
      moduleHead("Horários", "Distribuição semanal de disciplinas por turma.") +
      '<table class="pda-table"><thead><tr><th>Dia</th><th>Hora</th><th>Disciplina</th><th>Turma</th></tr></thead><tbody>' + rows + '</tbody></table>'
    );
  }

  /* ---------------------------------------------------------
     Render + ligação com o DOM
  --------------------------------------------------------- */
  var root = document.getElementById("root");
  var lastKey = null;

  function render() {
    var key = S.screen + ":" + S.activeModule;
    var changedView = key !== lastKey;
    lastKey = key;

    root.className = "pda-root pda-screen-" + S.screen;
    var html;
    if (S.screen === "login") html = loginHTML();
    else if (S.screen === "visitorChoice") html = visitorChoiceHTML();
    else if (S.screen === "schoolPicker") html = schoolPickerHTML();
    else if (S.screen === "schoolPage") html = schoolPageHTML();
    else if (S.screen === "matriculaForm") html = matriculaFormHTML();
    else if (S.screen === "matriculaSuccess") html = matriculaSuccessHTML();
    else if (S.screen === "roleForm") html = roleFormHTML();
    else if (S.screen === "staffForm") html = staffFormHTML();
    else html = appShellHTML();
    root.innerHTML = html;

    if (changedView) window.scrollTo(0, 0);
  }

  /* ---------------------------------------------------------
     Ações (delegação de eventos — registadas uma única vez)
  --------------------------------------------------------- */
  var handlers = {
    "choose-role": function (el) {
      S.role = el.getAttribute("data-role");
      S.formError = "";
      if (S.role === "visitante") S.screen = "visitorChoice";
      else { S.authMode = "entrar"; S.screen = "roleForm"; }
      render();
    },
    "staff-access": function () { S.screen = "staffForm"; S.formError = ""; S.staffAuthMode = "entrar"; render(); },
    "back-login": function () { S.screen = "login"; render(); },
    "back-visitor-choice": function () { S.screen = "visitorChoice"; render(); },
    "goto-school-picker": function () { S.screen = "schoolPicker"; render(); },
    "back-school-page": function () { S.screen = "schoolPage"; render(); },
    "goto-matricula": function () { S.screen = "matriculaForm"; render(); },
    "pick-school": function (el) {
      var slug = el.getAttribute("data-slug");
      var sch = S.schools.filter(function (s) { return s.slug === slug; })[0];
      if (!sch) return;
      S.currentSchoolSlug = slug;
      S.schoolName = sch.name;
      S.screen = "schoolPage";
      render();
    },
    "enter-app-as-visitor": function () {
      S.role = "visitante";
      S.displayName = "Visitante";
      S.activeModule = "feed";
      S.screen = "app";
      render();
    },
    "visitor-continue": function () {
      S.currentSchoolSlug = null;
      S.schoolName = "Portal do Aluno";
      S.displayName = "Visitante";
      S.role = "visitante";
      S.activeModule = "feed";
      S.screen = "app";
      render();
    },
    "toggle-auth-mode": function (el) { S.authMode = el.getAttribute("data-mode"); render(); },
    "toggle-staff-auth-mode": function (el) { S.staffAuthMode = el.getAttribute("data-mode"); render(); },
    "toggle-drawer": function (el) { S.drawerOpen = el.getAttribute("data-open") === "1"; render(); },
    "set-module": function (el) { S.activeModule = el.getAttribute("data-module"); S.drawerOpen = false; render(); },
    "logout": function () {
      S.screen = "login"; S.role = null; S.drawerOpen = false; S.activeModule = "feed"; S.displayName = "";
      render();
    },
    "toggle-like": function (el) {
      var id = el.getAttribute("data-post");
      S.likes[id] = !S.likes[id];
      render();
    },
    "toggle-setting": function (el) {
      var key = el.getAttribute("data-key");
      S.settings[key] = !S.settings[key];
      render();
    },
    "select-turma": function (el) {
      S.turmaSelecionadaProfessor = el.getAttribute("data-turma");
      S.activeModule = "presencas";
      S.presenceSaved = false;
      render();
    },
    "select-lancar": function (el) {
      S.selectedLancarTurma = el.getAttribute("data-turma");
      S.selectedLancarDisciplina = el.getAttribute("data-disciplina");
      render();
    },
    "remove-assignment": function (el) {
      var i = Number(el.getAttribute("data-index"));
      S.professorAssignments.splice(i, 1);
      render();
    },
    "remove-student-doc": function (el) {
      var aluno = el.getAttribute("data-aluno");
      var i = Number(el.getAttribute("data-index"));
      if (S.studentDocuments[aluno]) S.studentDocuments[aluno].splice(i, 1);
      render();
    },
    "toggle-presence": function (el) {
      var i = Number(el.getAttribute("data-index"));
      S.presence[i].status = PRESENCE_CYCLE[S.presence[i].status] || "presente";
      S.presenceSaved = false;
      render();
    },
    "save-presence": function () { S.presenceSaved = true; render(); },
    "confirm-item": function (el) {
      var i = Number(el.getAttribute("data-index"));
      S.confirmations[i].status = "ok";
      render();
    },
    "remove-book": function (el) {
      var i = Number(el.getAttribute("data-index"));
      S.books.escola.splice(i, 1);
      render();
    },
    "remove-confirmation": function (el) {
      var i = Number(el.getAttribute("data-index"));
      S.confirmations.splice(i, 1);
      render();
    },
    "manage-remove": function (el) {
      var key = el.getAttribute("data-key");
      var i = Number(el.getAttribute("data-index"));
      resolveListRef(key).splice(i, 1);
      render();
    },
    "noop": function () {}
  };

  var formHandlers = {
    "add-assignment": function (form) {
      var professor = form.professor.value.trim();
      if (!professor) return;
      S.professorAssignments.push({
        id: Date.now(),
        professor: professor,
        disciplina: form.disciplina.value,
        turma: form.turma.value,
        sala: form.sala.value,
        periodo: form.periodo.value
      });
      render();
    },
    "lancar-nota": function (form) {
      var turma = form.getAttribute("data-turma");
      var disciplina = form.getAttribute("data-disciplina");
      var aluno = form.getAttribute("data-aluno");
      var nota = form.nota.value;
      if (nota === "") return;
      nota = Number(nota);
      var existing = S.gradeEntries.filter(function (g) { return g.turma === turma && g.disciplina === disciplina && g.aluno === aluno; })[0];
      if (existing) existing.nota = nota;
      else S.gradeEntries.push({ turma: turma, disciplina: disciplina, aluno: aluno, avaliacao: "Avaliação atual", nota: nota });
      render();
    },
    "publicar-pauta": function (form) {
      var turma = form.turma.value;
      var resultados = [];
      var selects = form.querySelectorAll('select[name^="situ_"]');
      selects.forEach(function (s) {
        resultados.push({ aluno: s.getAttribute("data-aluno"), situacao: s.value });
      });
      var novaPauta = {
        id: Date.now(),
        turma: turma,
        ano: String(new Date().getFullYear()),
        publicadaEm: "agora mesmo",
        resultados: resultados
      };
      S.pautas.unshift(novaPauta);
      S.posts.unshift({
        id: "pauta" + novaPauta.id,
        tag: "Pauta",
        author: "__school__",
        time: "agora mesmo",
        body: "A pauta da turma " + turma + " (" + novaPauta.ano + ") já foi publicada. Consulta o teu resultado em Pautas, pesquisando pelo teu nome."
      });
      render();
    },
    "send-student-doc": function (form) {
      var aluno = form.aluno.value;
      var nome = form.nome.value.trim();
      if (!nome) return;
      if (!S.studentDocuments[aluno]) S.studentDocuments[aluno] = [];
      S.studentDocuments[aluno].push({ nome: nome });
      render();
    },
    "matricula": function (form) {
      var sch = currentSchool();
      var draft = {};
      (sch ? sch.matriculaCampos : []).forEach(function (label, i) {
        var input = form.querySelector('[name="campo_' + i + '"]');
        draft[label] = input ? input.value.trim() : "";
      });

      var fileFields = [
        ["doc_bi", "Bilhete de Identidade"],
        ["doc_foto1", "1ª Fotografia"],
        ["doc_foto2", "2ª Fotografia"],
        ["doc_certificado", "Certificado"]
      ];
      fileFields.forEach(function (f) {
        var input = form.querySelector('[name="' + f[0] + '"]');
        var fname = input && input.files && input.files[0] ? input.files[0].name : "";
        draft[f[1] + " (PDF)"] = fname ? fname + " ✓ anexado" : "não anexado";
      });

      S.matriculaDraft = draft;
      S.screen = "matriculaSuccess";
      render();
    },
    "role-login": function (form) {
      var name = (form.nome && form.nome.value) || "";
      var colegio = (form.colegio && form.colegio.value) || "";
      S.formError = "";
      S.displayName = name || (S.role === "aluno" ? "Aluno" : "Encarregado");
      if (colegio) {
        var sch = findOrCreateSchool(colegio);
        S.schoolName = sch.name;
        S.currentSchoolSlug = sch.slug;
      }
      S.activeModule = "feed";
      S.screen = "app";
      render();
    },
    "staff-login": function (form) {
      var cargo = (form.cargo && form.cargo.value) || "professor";
      var name = (form.nome && form.nome.value) || "";
      var colegio = (form.colegio && form.colegio.value) || "";
      S.role = cargo;
      S.displayName = name || ROLE_LABEL[cargo];
      if (colegio) {
        var sch = findOrCreateSchool(colegio);
        S.schoolName = sch.name;
        S.currentSchoolSlug = sch.slug;
      }
      S.activeModule = "feed";
      S.screen = "app";
      render();
    },
    "chat": function (form) {
      var channel = form.getAttribute("data-channel");
      var text = form.body.value.trim();
      if (!text) return;
      if (!S.chat[channel]) S.chat[channel] = [];
      S.chat[channel].push({ id: "m" + Date.now(), body: text, mine: true });
      render();
    },
    "publish": function (form) {
      var key = form.getAttribute("data-key");
      var t = form.t.value.trim();
      var b = form.b.value.trim();
      if (!t) return;
      if (!S.publishedByModule[key]) S.publishedByModule[key] = [];
      S.publishedByModule[key].unshift({ id: Date.now(), t: t, b: b, time: "agora mesmo" });
      render();
    },
    "manage-add": function (form) {
      var key = form.getAttribute("data-key");
      var val = form.val.value.trim();
      if (!val) return;
      resolveListRef(key).push(val);
      render();
    },
    "whatsapp": function (form) {
      var sch = currentSchool();
      if (sch) sch.whatsapp = form.numero.value;
      else S.whatsapp = form.numero.value;
      S.whatsappSaved = true;
      render();
    },
    "request-document": function (form) {
      var tipo = form.tipo.value;
      if (!tipo) return;
      S.documentRequests.unshift({ tipo: tipo, estado: "Solicitado" });
      render();
    },
    "config-colegio": function (form) {
      var sch = currentSchool();
      if (!sch) return;
      sch.area = form.area.value.trim() || sch.area;
      sch.info = form.info.value.trim() || sch.info;
      sch.regras = form.regras.value.trim();
      render();
    },
    "config-matricula": function (form) {
      var sch = currentSchool();
      if (!sch) return;
      sch.matriculaValor = form.valor.value.trim() || sch.matriculaValor;
      sch.matriculaPeriodo = form.periodo.value.trim() || sch.matriculaPeriodo;
      render();
    },
    "config-propinas": function (form) {
      var sch = currentSchool();
      if (!sch) return;
      sch.propinasValor = form.valor.value.trim() || sch.propinasValor;
      sch.propinasVencimento = form.vencimento.value.trim() || sch.propinasVencimento;
      sch.propinasMulta = form.multa.value.trim() || sch.propinasMulta;
      render();
    },
    "add-book": function (form) {
      var title = form.title.value.trim();
      if (!title) return;
      var author = form.author.value.trim();
      var preco = form.preco.value.trim();
      var qtd = form.qtd.value.trim();
      var meta = [author, preco ? ("Preço: " + preco) : "", qtd ? ("Qtd: " + qtd) : ""].filter(Boolean).join(" · ");
      S.books.escola.push({ id: "b" + Date.now(), title: title, author: meta || "Sem detalhes adicionais" });
      render();
    },
    "add-confirmation": function (form) {
      var val = form.val.value.trim();
      if (!val) return;
      S.confirmations.push({ label: val, status: "warn" });
      render();
    }
  };

  root.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    if (handlers[action]) handlers[action](el, e);
  });

  root.addEventListener("input", function (e) {
    var el = e.target;
    if (!el || !el.getAttribute) return;
    var filterType = el.getAttribute("data-live-filter");
    if (filterType === "schools") {
      var container = root.querySelector("#school-results");
      if (container) container.innerHTML = schoolResultsHTML(el.value);
    } else if (filterType === "pauta") {
      var pautaId = Number(el.getAttribute("data-pauta-id"));
      var pauta = S.pautas.filter(function (p) { return p.id === pautaId; })[0];
      var resultsEl = root.querySelector("#pauta-results-" + pautaId);
      if (pauta && resultsEl) resultsEl.innerHTML = pautaResultsHTML(pauta, el.value);
    }
  });

  root.addEventListener("submit", function (e) {
    var form = e.target.closest("[data-form]");
    if (!form) return;
    e.preventDefault();
    var type = form.getAttribute("data-form");
    if (formHandlers[type]) formHandlers[type](form, e);
  });

  render();

  // Carrossel do quadro: troca de foto a cada 8 segundos, com esmaecer
  // suave + um leve efeito de zoom (Ken Burns), só no ecrã de login.
  setInterval(function () {
    if (S.screen !== "login") return;
    var imgEl = document.getElementById("hero-carousel-img");
    if (!imgEl) return;
    imgEl.style.opacity = "0";
    setTimeout(function () {
      S.heroIndex = (S.heroIndex + 1) % HERO_IMAGES.length;
      imgEl.src = HERO_IMAGES[S.heroIndex];
      imgEl.style.opacity = "1";
      imgEl.classList.remove("pda-kenburns");
      void imgEl.offsetWidth; // força o navegador a reiniciar a animação
      imgEl.classList.add("pda-kenburns");
      var dotsWrap = document.querySelector(".pda-hero-dots");
      if (dotsWrap) {
        var dots = dotsWrap.querySelectorAll(".pda-hero-dot");
        dots.forEach(function (d, i) {
          d.classList.toggle("active", i === S.heroIndex);
        });
      }
    }, 700);
  }, 8000);
})();

</script>
</body>
</html>
